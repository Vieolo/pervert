[project]
name = "pervert"
version = "0.1.0"
description = "Analyzing and profiling python applications, innocently"
readme = "README.md"
authors = [
    { name = "Vieolo B.V." }
]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
pervert = "pervert:main"

[build-system]
requires = ["uv_build>=0.9.9,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "django>=5.2.8",
    "pytest>=9.0.2",
]
